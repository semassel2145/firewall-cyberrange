
name: firewall-vpn-evasion

hosts:
  - name: server
    base_box:
      image: seed
      mgmt_user: ubuntu
    flavor: m1.medium

  - name: client
    base_box:
      image: seed
      mgmt_user: ubuntu
    flavor: m1.medium

  - name: target
    base_box:
      image: seed
      mgmt_user: ubuntu
    flavor: m1.medium

routers:
  - name: router
    base_box:
      image: debian-12-x86_64
      mgmt_user: debian
    flavor: standard.small

wan:
  name: internet-connection
  cidr: 100.100.100.0/24

networks:
  - name: server-switch
    cidr: 192.168.20.0/24
    accessible_by_user: true

  - name: client-switch
    cidr: 192.168.30.0/24
    accessible_by_user: true

  - name: target-switch
    cidr: 192.168.40.0/24
    accessible_by_user: false

net_mappings:
  - host: server
    network: server-switch
    ip: 192.168.20.5

  - host: client
    network: client-switch
    ip: 192.168.30.5

  - host: target
    network: target-switch
    ip: 192.168.40.10

router_mappings:
  - router: router
    network: server-switch
    ip: 192.168.20.1

  - router: router
    network: client-switch
    ip: 192.168.30.1

  - router: router
    network: target-switch
    ip: 192.168.40.1

groups: []

